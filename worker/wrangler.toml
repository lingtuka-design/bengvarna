name = "bengvarna"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[assets]
directory = "../client/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "bengvarna-db"
database_id = "bb8e5913-b5ff-40d4-9ed6-b1770557c7b1"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "bengvarna-media"

[vars]
PUBLIC_SITE_URL = "https://bengvarna.inkhel.workers.dev"
